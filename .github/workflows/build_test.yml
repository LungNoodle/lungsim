name: Build and Test Matrix

on:
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type to use for the build and test matrix.'
        required: false
        default: 'Release'
      python_version:
        description: 'Python version to use for the build and test matrix.'
        required: false
        default: '3.10'

jobs:
  pipeline:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows 2025 MSVC (Ninja)",
            build_type: "Release",
            os: windows-2025,
          }
        - {
            name: "Ubuntu 24.04",
            build_type: "Release",
            os: ubuntu-24.04,
          }
        - {
            name: "Ubuntu 24.04 with SuperLU",
            build_type: "Release",
            super_lu: true,
            os: ubuntu-24.04,
          }
        - {
            name: "macOS Sonoma",
            build_type: "Release",
            os: macos-14,
            gfortran: gfortran-14,
          }

    steps:
