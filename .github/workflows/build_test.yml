#    - name: Exclude unused files from cache
#      if: runner.os == 'Windows' && steps.cache-install.outputs.cache-hit != 'true'
#      working-directory: oneapi
#      run: scripts/cache_exclude_windows.ps1

    - name: Setup MSVC environment
      if: runner.os == 'Windows'
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Checkout lungsim
      uses: actions/checkout@v6
      with:
        path: lungsim

    - name: Report CMake version
      run: cmake --version

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python_version || '3.11' }}

    - name: Install numpy
      run: |
        pip install "numpy"

    - name: Install SuperLU
      if: matrix.config.super_lu
      shell: bash
      run: sudo apt-get install libsuperlu-dev

    - name: Install SWIG
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install swig

    - name: Install CMake and Ninja
      if: runner.os == 'Windows'
      uses: lukka/get-cmake@latest

    - name: Generate build instructions - Windows
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        cmake ^
          -S lungsim ^
          -B build-lungsim ^
          -G Ninja ^
          -D AETHER_ENABLE_TESTS=FALSE ^
          -D CMAKE_C_COMPILER=cl ^
          -D CMAKE_CXX_COMPILER=cl
        REM cmake -S lungsim -B build-lungsim -D CMAKE_Fortran_COMPILER="%FC%.exe" -D CMAKE_C_COMPILER="%CC%.exe" -D CMAKE_CXX_COMPILER="%CXX%.exe" -D AETHER_ENABLE_TESTS=FALSE

    - name: Generate build instructions - Non-Windows
      shell: bash
      if: runner.os != 'Windows'
      run: |
        cmake \
          -S lungsim \
          -B build-lungsim \
          -D CMAKE_Fortran_COMPILER=${{ matrix.config.gfortran || 'gfortran' }} \
          -D AETHER_ENABLE_TESTS=FALSE \
          -D CMAKE_BUILD_TYPE=${{ inputs.build_type || matrix.config.build_type }}

    - name: Build lungsim
      run: |
        cmake --build build-lungsim --config Release

    - name: Test lungsim
      shell: bash
      run: |
        pip install wheel
        pip install $GITHUB_WORKSPACE/build-lungsim/src/bindings/python/package

        python $GITHUB_WORKSPACE/lungsim/.github/scripts/diagnostics_test.py

        exit $?
